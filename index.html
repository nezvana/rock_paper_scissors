<!DOCTYPE html>
<html>
<head>
    <title>Rock, Paper, Scissors</title>
</head>
<body>
    <h1>Rock, Paper, Scissors - the Game</h1>
    <p>please open the dev console to play</p> 
    <p id="scoreComp"> </p>
    <p id="scoreHuman"> </p>   
    <script>

function getCompChoice(){
let randomNumber = Math.floor(Math.random() * 3);
if (randomNumber === 0) {
	return "rock";
	}
	else if (randomNumber === 1) {
	return "paper";	
		}
	else {
	return "scissors";	
		}
}

console.log(getCompChoice());


function getHumanChoice(){
    return prompt("Please enter your choice").toLowerCase();
	}

	
let compScore = 0
let humanScore = 0
	
function playRound(compChoice, humanChoice){
	 if (compChoice === "rock" && humanChoice === "rock" || 
        compChoice === "paper" && humanChoice === "paper" || 
        compChoice === "scissors" && humanChoice === "scissors")
	{
		alert("You are even!");
		
        document.getElementById("scoreComp").innerHTML = "Computer Score: " + compScore;
        document.getElementById("scoreHuman").innerHTML = "Human Score: " + humanScore;
	}
	else if (compChoice === "rock" && humanChoice === "paper" || 
        compChoice === "paper" && humanChoice === "scissors" || 
        compChoice === "scissors" && humanChoice === "rock")
    {
		alert("You win!");
		/*compScore = 0*/
		humanScore ++
        document.getElementById("scoreComp").innerHTML = "Computer Score: " + compScore;
        document.getElementById("scoreHuman").innerHTML = "Human Score: " + humanScore;    
	}
	else 
    {
		alert("You lose!");
		compScore ++
		/*humanScore = 0*/
        document.getElementById("scoreComp").innerHTML = "Computer Score: " + compScore;
        document.getElementById("scoreHuman").innerHTML = "Human Score: " + humanScore;
	}
	}
	
function playGame(){	


while (compScore < 5 && humanScore < 5){
    const humanSelection = getHumanChoice();
const computerSelection = getCompChoice();
    playRound(computerSelection, humanSelection);
}


	if (compScore === 5){
		alert ("Game over");
	}
	else if (humanScore === 5){
		alert ("You win the entire game");
		}
        
}

playGame();

    </script>
</body>
</html>
